# Supabase's free plan pauses a project after a week with no activity. This pings the leaderboard every 3 days.
name: Keep leaderboard awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the API (reads the database)
        run: |
          BASE=$(grep -o "apiBase: *'[^']*'" config.js | sed "s/.*'\(.*\)'/\1/")
          if [ -z "$BASE" ]; then echo "apiBase not set in config.js - nothing to ping"; exit 0; fi
          curl -fsS "$BASE/api/board/alltime" | head -c 200
